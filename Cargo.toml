[package]
name = "kanso"
version = "0.1.0"
edition = "2021"
description = "A fast, beautiful, highly customizable terminal text editor"
license = "MIT"

[dependencies]
crossterm = { version = "0.28", features = ["bracketed-paste"] }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
directories = "5"
thiserror = "2"

[profile.release]
lto = true
